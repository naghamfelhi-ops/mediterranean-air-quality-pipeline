id: ingest_air_quality
namespace: air_quality

inputs:
  - id: start_date
    type: STRING
    defaults: "2025-11-05"
  - id: end_date
    type: STRING
    defaults: "2026-09-30"

tasks:
  - id: fetch_to_lake
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - air_quality_lake:/lake
    beforeCommands:
      - pip install requests pandas pyarrow > /dev/null
    env:
      START_DATE: "{{ inputs.start_date }}"
      END_DATE: "{{ inputs.end_date }}"
    script: |
      import os, time, requests
      import pandas as pd
      from datetime import datetime, timezone

      CITIES = {
          "Tunis": (36.81, 10.18),
          "Madrid": (40.42, -3.70),
          "Barcelona": (41.39, 2.17),
          "Rome": (41.90, 12.50),
          "Athens": (37.98, 23.73),
          "Beirut": (33.89, 35.50),
      }
      VARS = "pm10,pm2_5,nitrogen_dioxide,ozone,sulphur_dioxide,carbon_monoxide"
      URL = "https://air-quality-api.open-meteo.com/v1/air-quality"

      start = os.environ["START_DATE"]
      end = os.environ["END_DATE"]

      for city, (lat, lon) in CITIES.items():
          r = requests.get(URL, params={
              "latitude": lat, "longitude": lon,
              "hourly": VARS,
              "start_date": start, "end_date": end,
              "timezone": "UTC",
          }, timeout=60)
          r.raise_for_status()

          df = pd.DataFrame(r.json()["hourly"])
          df["time"] = pd.to_datetime(df["time"])
          df["city"] = city
          df["latitude"] = lat
          df["longitude"] = lon
          df["ingested_at"] = datetime.now(timezone.utc)

          out_dir = f"/lake/raw/air_quality/city={city}"
          os.makedirs(out_dir, exist_ok=True)
          path = f"{out_dir}/{start}_{end}.parquet"
          df.to_parquet(path, index=False)
          print(f"{city}: {len(df)} lignes -> {path}")
          time.sleep(1)