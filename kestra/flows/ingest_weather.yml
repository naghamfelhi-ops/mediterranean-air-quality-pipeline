id: ingest_weather
namespace: air_quality

inputs:
  - id: start_date
    type: STRING
    defaults: "2025-11-05"
  - id: end_date
    type: STRING
    defaults: "2026-09-30"

tasks:
  - id: fetch_to_lake
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: air-quality-ingestion:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - air_quality_lake:/lake
    commands:
      - python -m aq_ingest weather --start {{ inputs.start_date }} --end {{ inputs.end_date }}
